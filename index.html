<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Launcher</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        @font-face {
            font-family: 'Comfortaa';
            src: url('assets/fonts/Comfortaa-Bold.ttf') format('truetype');
            font-weight: 700;
        }
        @font-face {
            font-family: 'Comfortaa';
            src: url('assets/fonts/Comfortaa-Regular.ttf') format('truetype');
            font-weight: 400;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Comfortaa', cursive, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .center-box {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .discord-link {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-decoration: none;
            background: linear-gradient(135deg, #38bdf8 0%, #0088ff 55%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px rgba(0, 136, 255, 0.45));
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .discord-link:hover {
            filter: drop-shadow(0 0 50px rgba(56, 189, 248, 0.8));
            transform: scale(1.03);
        }

        .coming-soon {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: lowercase;
            background: linear-gradient(180deg, #ffffff 15%, rgba(255, 255, 255, 0.45) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.92;
        }

        @media (max-width: 768px) {
            .discord-link {
                font-size: 2.2rem;
            }
            .coming-soon {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div class="center-box">
        <a href="https://dc.fluxlauncher.xyz/" class="discord-link">dc.fluxlauncher.xyz</a>
        <div class="coming-soon">coming soon</div>
    </div>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const comets = [];
        const cometCount = 9;

        class Comet {
            constructor(initRandom = false) {
                this.reset(initRandom);
            }

            reset(initRandom = false) {
                this.angle = (36 + Math.random() * 10) * Math.PI / 180;
                this.speed = 8 + Math.random() * 8;
                this.length = 130 + Math.random() * 150;
                this.thickness = 1.3 + Math.random() * 1.5;

                const isLav = Math.random() > 0.35;
                this.headColor = isLav ? 'rgba(255, 255, 255, 1)' : 'rgba(245, 243, 255, 1)';
                this.tailColor = isLav ? 'rgba(196, 181, 253, 0.85)' : 'rgba(224, 231, 255, 0.75)';
                this.tailEnd = isLav ? 'rgba(139, 92, 246, 0)' : 'rgba(167, 139, 250, 0)';

                if (initRandom) {
                    this.x = Math.random() * (width + 400) - 200;
                    this.y = Math.random() * (height + 200) - 200;
                } else {
                    if (Math.random() > 0.4) {
                        this.x = Math.random() * (width + 200) - 100;
                        this.y = -100 - Math.random() * 150;
                    } else {
                        this.x = -150 - Math.random() * 100;
                        this.y = Math.random() * (height * 0.7) - 100;
                    }
                }
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x > width + 250 || this.y > height + 250) {
                    this.reset(false);
                }
            }

            draw() {
                const tailX = this.x - Math.cos(this.angle) * this.length;
                const tailY = this.y - Math.sin(this.angle) * this.length;

                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, this.headColor);
                grad.addColorStop(0.25, this.tailColor);
                grad.addColorStop(1, this.tailEnd);

                ctx.save();
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.shadowColor = '#c4b5fd';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ede9fe';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.thickness * 1.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        for (let i = 0; i < cometCount; i++) {
            comets.push(new Comet(true));
        }

        const stars = [];
        for (let i = 0; i < 45; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.2 + 0.3,
                alpha: Math.random() * 0.6 + 0.1,
                speed: Math.random() * 0.02 + 0.005,
                phase: Math.random() * Math.PI * 2
            });
        }

        let time = 0;

        function animate() {
            time += 0.02;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            for (let star of stars) {
                const currentAlpha = star.alpha + Math.sin(time + star.phase) * 0.25;
                ctx.fillStyle = `rgba(235, 230, 255, ${Math.max(0, currentAlpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            for (let comet of comets) {
                comet.update();
                comet.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
